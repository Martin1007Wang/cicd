{% extends 'todos/base.html' %}

{% block title %}Todo App{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="card-title text-center mb-4">Todo List</h1>

        <form method="post" action="{% url 'todos:add' %}" class="mb-4">
          {% csrf_token %}
          <div class="input-group">
            <input type="text" class="form-control" name="title" placeholder="e.g., Do laundry" required>
            <button type="submit" name="submit" class="btn btn-primary">Add</button>
          </div>
        </form>

        {% if todo_list %}
        <ul class="list-group list-group-flush">
          {% for todo in todo_list %}
          <li class="list-group-item d-flex justify-content-between align-items-center {% if todo.isCompleted %}completed{% endif %}">
            <form method="post" action="{% url 'todos:update' todo.id %}" class="d-inline">
              {% csrf_token %}
              <input type="checkbox" name="isCompleted" onchange="this.form.submit()" {% if todo.isCompleted %}checked{% endif %} class="form-check-input me-2">
            </form>
            <span class="flex-grow-1 {% if todo.isCompleted %}text-decoration-line-through{% endif %}">{{ todo.title }}</span>
            <a href="{% url 'todos:delete' todo.id %}" class="btn btn-sm btn-outline-danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
              </svg>
            </a>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="text-center text-muted">Your to-do list is empty.</p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
